<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arduino Code Gallery</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Highlight.js for code syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.0/styles/atom-one-dark.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-white shadow-sm fixed w-full top-0 z-50">
        <nav class="container mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fas fa-microchip text-blue-600 text-2xl"></i>
                <h1 class="text-xl font-semibold text-gray-800">Arduino Code Gallery</h1>
            </div>
            <div class="hidden md:flex space-x-6">
                <a href="#" class="text-gray-600 hover:text-blue-600 transition-colors">Home</a>
                <a href="#" class="text-gray-600 hover:text-blue-600 transition-colors">Submit Code</a>
                <a href="#" class="text-gray-600 hover:text-blue-600 transition-colors">Login</a>
            </div>
            <button class="md:hidden text-gray-600">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="relative pt-16 mt-16">
        <div class="h-[400px] bg-cover bg-center" style="background-image: url('https://images.pexels.com/photos/256259/pexels-photo-256259.jpeg');">
            <div class="absolute inset-0 bg-black bg-opacity-50"></div>
            <div class="relative container mx-auto px-4 h-full flex flex-col justify-center items-center text-center">
                <h2 class="text-4xl md:text-5xl font-bold text-white mb-4">Arduino Code Examples</h2>
                <p class="text-xl text-gray-200 mb-8">Discover and learn from a collection of Arduino sketches</p>
                <div class="w-full max-w-xl">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search code examples..." class="w-full px-6 py-3 rounded-full border-2 border-transparent focus:border-blue-500 focus:outline-none shadow-lg">
                        <i class="fas fa-search absolute right-6 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-12">
        <div id="code-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Code cards will be dynamically inserted here -->
        </div>
    </main>

    <!-- Modal -->
    <div id="codeModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg w-full max-w-4xl mx-4 p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitle" class="text-xl font-semibold text-gray-800"></h3>
                <button id="closeModal" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="bg-gray-900 rounded-lg p-4 overflow-x-auto">
                <pre><code id="codeContent" class="language-cpp"></code></pre>
            </div>
            <button id="copyCode" class="mt-4 px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition-colors">
                <i class="fas fa-copy mr-2"></i>Copy Code
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.5.0/highlight.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
